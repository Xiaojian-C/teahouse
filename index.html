<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one-screen portrait pixel game. HUD, pixel-art teahouse canvas, RPG dialogue box, 12-slot item bar. Single committed look. */
:root{
  --wall:#d6ead9; --parch:#fbe9bd; --parch-d:#ecd19a; --edge:#4a2a1a;
  --wood:#a8623a; --wood-l:#d99a5b; --wood-d:#6b3d24;
  --ink:#3a2318; --soft:#8a6a52; --jade:#1b7f67; --red:#d94a3d; --gold:#f2b84b;
  --f-ui:'Pixelify Sans','Courier New',monospace;
  --f-han:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  --f-py:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#3b2418;color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--jade);outline-offset:1px}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.pxc{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.frame{background:var(--parch);border:4px solid var(--edge);box-shadow:inset 0 0 0 3px var(--wood-l)}
.hz{font-family:var(--f-han);font-weight:900}
.py{font-family:var(--f-py);font-weight:800;color:var(--jade)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grow{flex:1}

#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--wood-d);overflow:hidden}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding-block:7px;background:var(--wood);border-bottom:4px solid var(--edge)}
.coins{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.coins img{width:22px;height:22px}
.hbtn{position:relative;padding:2px 10px 3px;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.hbtn:active,.pbtn:active{transform:translateY(2px)}
.hbtn .hz{font-size:15px}
.hbtn .sub{font-size:11px;font-weight:500;color:var(--soft)}
.hbtn .n{font-size:11px;font-weight:700;color:var(--jade)}
.hbtn.alert{background:var(--gold)}
.snd{width:38px;height:38px;display:grid;place-items:center;font-size:16px;font-weight:700}
.snd.off{background:var(--parch-d);color:var(--soft)}
.snd.warn{background:#f6a08f}

/* Scene */
.scene{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--wall)}
#cv{position:absolute;top:0;left:0;display:block}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:5px 12px 6px;font-size:15px;font-weight:500;text-align:center;z-index:4;white-space:nowrap}
.toast.wrap{white-space:normal;font-size:13px}
.toast .hz{font-size:18px}
.toast .py{font-size:14px;margin:0 2px}
.float{position:absolute;left:18%;top:38%;font-weight:700;font-size:24px;color:#fff3c4;text-shadow:2px 2px 0 var(--edge),-2px 0 0 var(--edge),0 -2px 0 var(--edge);animation:rise 1.2s forwards;pointer-events:none;z-index:3}

/* Dialogue */
.dwrap{padding-block:8px 6px}
.dlg{display:flex;flex-direction:column;gap:2px;padding:8px 10px 8px;min-height:150px}
.dtop{display:flex;align-items:center;gap:8px;min-height:44px}
.face{width:44px;height:44px;background:var(--wall) no-repeat;background-size:60px 69px;background-position:-8px -9px;image-rendering:pixelated;border:3px solid var(--edge);flex:none}
.nm{display:flex;flex-direction:column;line-height:1.1}
.nm .hz{font-size:16px}
.nm .py{font-size:12px}
.pbtn{min-width:44px;height:40px;padding:0 10px;background:var(--parch-d);border:4px solid var(--edge);font-weight:700;font-size:16px;display:grid;place-items:center}
.pbtn.go{background:var(--gold);animation:nudge 1s steps(2) infinite}
.serve{font-weight:700;font-size:13px;color:var(--red);text-align:right;line-height:1.1;animation:nudge 1s steps(2) infinite}
.line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 2px;min-height:50px}
.unit{display:inline-flex;padding:1px 2px 0}
.unit.on{background:var(--gold)}
.tok{display:inline-flex;flex-direction:column;align-items:center;padding:0 1px}
.tok .py{font-size:13px;line-height:1.2;min-height:15px}
.tok .hz{font-size:26px;line-height:1.15}
.dlg .tr{font-size:15px;font-weight:500;color:var(--soft);min-height:20px;text-align:left;line-height:1.2}
.dlg button.tr{color:var(--jade);text-decoration:underline}

/* Item bar */
.traywrap{position:relative}
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-block:2px 10px}
.choices{position:absolute;inset:0;z-index:2;background:var(--wood-d);display:flex;flex-direction:column;gap:6px;padding-block:0 10px}
.chlab{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--parch)}
.chlab b{background:var(--gold);color:var(--ink);border:3px solid var(--edge);padding:0 9px 1px;font-size:19px}
.chrow{flex:1;min-height:0;display:flex;gap:8px}
.ch{flex:1;min-width:0;background:var(--parch);border:4px solid var(--edge);box-shadow:inset 0 0 0 3px var(--wood-l);display:flex;align-items:center;justify-content:center;gap:2px}
.ch:active{transform:translateY(2px)}
.ch .tok .hz{font-size:24px}
.ch.no{background:var(--parch-d);box-shadow:none;opacity:.5;animation:shake .3s steps(3)}
.slot{background:#e7c58a;border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #f6dfaa;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0}
.slot.empty{background:#b98756;box-shadow:inset 0 0 0 2px #c99a66}
.slot img{width:36px;height:36px}
.slot .lb{font:900 12px/1.1 var(--f-han)}
.slot .lb.off{visibility:hidden}
.slot:active:not(.empty){transform:translateY(2px)}
.slot.pulse{animation:pulse .8s steps(2) infinite}
.slot.no{animation:shake .3s steps(3)}

/* Overlays */
.ov{position:absolute;inset:0;background:rgba(40,22,12,.62);z-index:20;display:flex}
.ov.mid{align-items:center;justify-content:center;z-index:25}
.ov.low{align-items:flex-end}
.ncard{width:min(300px,86%);padding:14px 14px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;animation:pop .2s steps(3)}
.ncard .tagl{background:var(--red);color:#fff7e0;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:2px 12px 3px;margin-bottom:6px}
.ncard img{width:96px;height:96px;object-fit:contain}
.ncard .hz{font-size:54px;line-height:1.15}
.ncard .py{font-size:22px}
.ncard .mean{font-size:19px;font-weight:500;margin:2px 0 12px}
.ncard .btns{display:flex;gap:10px;width:100%}
.ncard .pbtn{flex:1;height:46px;animation:none}
.panel{width:100%;max-height:88%;display:flex;flex-direction:column;border-bottom:0;animation:up .2s steps(4)}
.panel header{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.panel h2{margin:0;font-size:22px;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font:500 14px var(--f-ui);color:var(--soft)}
.tabs{display:flex;gap:6px;padding-bottom:8px}
.tab{flex:1;padding:4px;background:var(--parch-d);border:3px solid var(--edge);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tab .hz{font-size:15px}
.tab .sub{font-size:12px;font-weight:500;color:var(--soft)}
.tab[aria-selected="true"]{background:var(--jade);color:#fff}
.tab[aria-selected="true"] .sub{color:#d6f2e8}
.body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 20px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;background:#fff6dc;border:3px solid var(--wood-l);padding:6px 8px}
.row .say{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.row img{width:48px;height:48px;object-fit:contain;flex:none}
.row .hz{font-size:20px}
.row .py{font-size:14px;margin-left:6px}
.row .tr{display:block;font-size:14px;font-weight:500;color:var(--soft);line-height:1.15}
.buy{flex:none;display:flex;align-items:center;gap:4px;background:var(--gold);border:3px solid var(--edge);padding:4px 10px 4px 6px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.buy img{width:18px;height:18px}
.buy:disabled{background:#e2d2b0;color:#a8957a;cursor:default}
.own{flex:none;font-weight:700;color:var(--jade);font-size:14px;padding:0 4px}
.cardtop{display:flex;align-items:center;gap:12px;background:var(--wall);border:3px solid var(--edge);padding:8px 12px;margin-bottom:10px}
.cardtop img{width:60px;height:69px}
.cardtop b{font:900 20px/1.2 var(--f-han);display:block}
.cardtop span{font-size:15px;font-weight:500;color:var(--soft)}
.cardtop em{font-style:normal;font-weight:700;color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.grp{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:12px 0 5px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wcard{background:#fff6dc;border:3px solid var(--wood-l);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.wcard img{width:40px;height:40px;object-fit:contain}
.wcard .hz{font-size:20px;line-height:1.2}
.wcard.big .hz{font-size:26px;line-height:40px}
.wcard .py{font-size:12px}
.wcard .tr{font-size:12px;font-weight:500;color:var(--soft);line-height:1.15;overflow-wrap:anywhere}
.wcard .st{font-size:11px;letter-spacing:1px;color:#d8c39a}
.wcard .st b{color:#e09a1a}
.wcard.lock{background:var(--parch-d);border-style:dashed;color:#b79c72;justify-content:center;min-height:92px;font-size:24px;font-weight:700}
.note{font-size:13px;font-weight:500;color:var(--soft);text-align:center;margin:14px 0 4px}
.reset{display:block;margin:4px auto 0;font-size:13px;color:var(--soft);text-decoration:underline;padding:8px}
.reset.sure{color:var(--red);font-weight:700}
.savebox{display:flex;flex-direction:column;gap:6px}
.savebox .pbtn,.fb.pbtn{width:100%;height:auto;min-height:40px;padding:6px 10px;font-size:15px;text-align:center}
.savebox textarea{font:13px/1.3 monospace;color:var(--ink);background:#fff6dc;border:3px solid var(--wood-l);padding:6px;resize:none;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;word-break:break-all}
.fb.pbtn{margin-top:14px;background:var(--gold);color:var(--ink);text-decoration:none;box-sizing:border-box}
.ver{display:block;text-align:center;font-size:12px;color:var(--soft);margin:2px 0 0}
.start .tip{font-size:13px;line-height:1.3;background:var(--parch);border:3px solid var(--edge);padding:6px 10px;max-width:330px;margin:6px 0 0}
.fbstart{font-size:15px;font-weight:700;color:var(--jade);margin-top:6px}

/* Start */
.start{position:absolute;inset:0;z-index:30;background:repeating-linear-gradient(90deg,#d6ead9 0 21px,#cbe3cf 21px 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:24px;text-align:center}
.start .por{padding:10px 18px 0;background:var(--wall)}
.start .por img{width:160px;height:184px;display:block}
.start #title{width:min(300px,84%);height:auto;margin-top:10px}
.start h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.start p{margin:0 0 8px;font-size:17px;font-weight:500;color:var(--soft)}
.langs{display:flex;gap:12px;width:100%;max-width:330px}
.lang{flex:1;padding:12px 6px;font-weight:700;font-size:21px}
.lang:active{transform:translateY(2px)}

@keyframes rise{to{transform:translateY(-50px);opacity:0}}
@keyframes nudge{50%{transform:translateY(-2px)}}
@keyframes pulse{50%{background:var(--gold);box-shadow:inset 0 0 0 2px #fff3c4}}
@keyframes shake{33%{transform:translateX(-3px)}66%{transform:translateX(3px)}}
@keyframes pop{from{transform:scale(.85)}}
@keyframes up{from{transform:translateY(30%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<div id="app">
  <header class="hud gut">
    <div class="coins frame pxc"><img class="px" id="coinImg" alt=""><span id="coinN">0</span></div>
    <span class="grow"></span>
    <button class="hbtn frame pxc" id="btnBook"><span class="hz">词语 <span class="n" id="bookN">0</span></span><span class="sub" id="lblBook">Words</span></button>
    <button class="hbtn frame pxc" id="btnShop"><span class="hz">商店</span><span class="sub" id="lblShop">Shop</span></button>
    <button class="snd frame pxc" id="btnSound" aria-label="Sound">♪</button>
  </header>

  <main class="scene" id="scene">
    <canvas id="cv" width="125" height="110"></canvas>
    <div class="toast frame pxc" id="toast" hidden></div>
    <div class="float" id="float" hidden></div>
  </main>

  <div class="dwrap gut">
    <section class="dlg frame pxc" id="dlg">
      <div class="dtop">
        <div class="face" id="face"></div>
        <div class="nm"><span class="hz" id="whoH"></span><span class="py" id="whoP"></span></div>
        <span class="grow"></span>
        <span class="serve" id="serve" hidden></span>
        <button class="pbtn pxc" id="btnAgain" aria-label="Replay" hidden>♪</button>
        <button class="pbtn go pxc" id="btnNext" aria-label="Next" hidden>▶</button>
      </div>
      <div class="line" id="line"></div>
      <div class="tr" id="tr"></div>
    </section>
  </div>

  <div class="traywrap">
    <nav class="tray gut" id="tray" aria-label="Menu"></nav>
    <div class="choices gut" id="choices" hidden></div>
  </div>

  <div class="ov mid" id="cardOv" hidden></div>
  <div class="ov low" id="sheet" hidden></div>

  <section class="start gut" id="start">
    <div class="por frame pxc"><img class="px" id="startCat" alt=""></div>
    <img class="px" id="title" alt="喵喵茶馆">
    <h1>Miao Miao Teahouse</h1>
    <p>Learn Chinese · Aprende chino</p>
    <div class="langs">
      <button class="lang frame pxc" data-lang="en" id="langEn">English</button>
      <button class="lang frame pxc" data-lang="es" id="langEs">Español</button>
    </div>
    <p class="tip" id="iabTip" hidden>To keep your progress, open this page in your browser.<br>Para guardar tu progreso, abre esta página en tu navegador.</p>
    <a class="fbstart" id="fbStart" target="_blank" rel="noopener" hidden>Feedback · Opinión</a>
    <span class="ver" id="verStart"></span>
  </section>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const VERSION='0.5';
const FEEDBACK_URL=''; // paste the feedback form link here; the buttons stay hidden while it is empty

/* ---------- Words ---------- */
const W={
  nihao:{h:'你好',p:'nǐ hǎo',en:'hello',es:'hola',g:'ph'},
  huanying:{h:'欢迎',p:'huānyíng',en:'welcome',es:'bienvenido',g:'ph'},
  woyao:{h:'我要',p:'wǒ yào',en:"I'd like…",es:'quiero…',g:'ph'},

  buyao:{h:'我不要',p:'wǒ bú yào',en:"I don't want…",es:'no quiero…',g:'ph'},
  duoshaoqian:{h:'多少钱',p:'duōshao qián',en:'how much is it?',es:'¿cuánto cuesta?',g:'ph'},
  si:{h:'四',p:'sì',en:'four',es:'cuatro',g:'num'},
  wu:{h:'五',p:'wǔ',en:'five',es:'cinco',g:'num'},
  liu:{h:'六',p:'liù',en:'six',es:'seis',g:'num'},
  qi:{h:'七',p:'qī',en:'seven',es:'siete',g:'num'},
  ba:{h:'八',p:'bā',en:'eight',es:'ocho',g:'num'},
  jiu:{h:'九',p:'jiǔ',en:'nine',es:'nueve',g:'num'},
  shi:{h:'十',p:'shí',en:'ten',es:'diez',g:'num'},

  ge:{h:'个',p:'gè',en:'counter: things',es:'clasificador general',g:'num'},
  bei:{h:'杯',p:'bēi',en:'counter: cups',es:'clasificador: tazas',g:'num'},
  wan:{h:'碗',p:'wǎn',en:'counter: bowls',es:'clasificador: tazones',g:'num'},
  chuan:{h:'串',p:'chuàn',en:'counter: skewers',es:'clasificador: brochetas',g:'num'},
  kuai:{h:'块',p:'kuài',en:'counter: pieces · also yuan (money)',es:'clasificador: trozos · también yuanes',g:'num'},
  cha:{h:'茶',p:'chá',en:'tea',es:'té',g:'food',mw:'bei',x:{en:['tea','a cup of tea','cups of tea'],es:['té','una taza de té','tazas de té']}},
  baozi:{h:'包子',p:'bāozi',en:'steamed bun',es:'bollo al vapor',g:'food',mw:'ge',x:{en:['steamed buns','one steamed bun','steamed buns'],es:['bollos al vapor','un bollo al vapor','bollos al vapor']}},
  tangyuan:{h:'汤圆',p:'tāngyuán',en:'sweet rice balls',es:'bolitas dulces de arroz',g:'food',mw:'wan',x:{en:['sweet rice balls','a bowl of sweet rice balls','bowls of sweet rice balls'],es:['bolitas dulces de arroz','un tazón de bolitas de arroz','tazones de bolitas de arroz']}},
  jiaozi:{h:'饺子',p:'jiǎozi',en:'dumpling',es:'empanadilla china',g:'food',mw:'ge',x:{en:['dumplings','one dumpling','dumplings'],es:['empanadillas chinas','una empanadilla china','empanadillas chinas']}},

function speakSeq(units,who,hi){

  if(hasTTS){try{speechSynthesis.cancel();}catch(e){}}

    let i=-1;

      if(my!==spk)return res(false);
      do{i++;}while(i<units.length&&!units[i].say);
      if(i>=units.length){if(hi)hi(-1);return res(true);}
      if(hi)hi(i);

let cur=null,lastAnimal=null,gen=0,runGen=-1;
function Stop(){}

function makeOrder(){
  const own=FOODS.filter(f=>S.own[f]);
  const wpick=()=>{const bag=[];own.forEach(f=>{bag.push(f);if((S.m[f]||0)<3)bag.push(f,f);});return pick(bag);};
  const n=S.served;
  if(n<2)return{bare:true,parts:[{id:wpick(),q:0}]};
  const maxQ=n>=14?3:2;
  const q=()=>n>=6&&Math.random()<.6?1+Math.floor(Math.random()*maxQ):0;
  const parts=[{id:wpick(),q:q()}];
  if(n>=22&&own.length>=4&&Math.random()<.3){
    let b;do{b=wpick();}while(b===parts[0].id);
    parts[0].q=Math.min(parts[0].q,2);parts.push({id:b,q:Math.min(q(),2)});
  }
  let form='want',decoy=null;
  if(n>=8&&Math.random()<.3)form='please';
  else if(n>=12&&own.length>=3&&parts.length===1&&Math.random()<.35){form='not';do{decoy=wpick();}while(decoy===parts[0].id);}
  return{bare:false,parts,form,decoy};
}
function buildOrder(o){
  const L=S.lang,units=[],words=[],need={},trs=[];
  if(o.form==='not'){units.push(U('buyao'),U(o.decoy),PU('，'));words.push('buyao',o.decoy);}
  if(!o.bare){const lead=o.form==='please'?'qinggeiwo':'woyao';units.push(U(lead));words.push(lead);}
  o.parts.forEach((pt,i)=>{
    const f=W[pt.id];
    if(i){units.push(U('he'));words.push('he');}
    if(pt.q){
      const nid=['','yi','liang','san'][pt.q],mw=W[f.mw];
      units.push({say:W[nid].h+mw.h,toks:[{h:W[nid].h,p:pt.q===1?(T4[f.mw]?'yí':'yì'):W[nid].p,w:nid},{h:mw.h,p:f.mw==='ge'?'ge':mw.p,w:f.mw}]});
      words.push(nid,f.mw);
    }
    units.push(U(pt.id));words.push(pt.id);
    need[pt.id]=(need[pt.id]||0)+Math.max(1,pt.q);
    const x=f.x[L];trs.push(pt.q===0?x[0]:pt.q===1?x[1]:NUM[L][pt.q]+' '+x[2]);
  });
  let tr;
  if(o.bare)tr=cap(W[o.parts[0].id][L]);
  else{
    const body=trs.join(t().and);
    tr=o.form==='please'?t().please+body+'.':o.form==='not'?t().dont+W[o.decoy].x[L][0]+t().butLike+body+'.':t().like+body+'.';
    units.push(PU('。'));
  }
  let total=0;o.parts.forEach(pt=>{total+=UNIT[pt.id]*Math.max(1,pt.q);});
  return{units,words,need,tr,total};
}
async function visit(g){
  const pool=ANIMALS.filter(a=>S.served>=a[1]).map(a=>a[0]);
  let a;do{a=pick(pool);}while(pool.length>1&&a===lastAnimal);
  lastAnimal=a;plateItems=[];
  cust={id:a,state:'in',t0:performance.now(),joy:0,shake:0,px:-44,py:0};
  await sleep(800);chk(g);
  if(!clipsReady){await Promise.race([decodeClips(),sleep(2500)]);chk(g);}
  await teach(g,[a]);
  await teach(g,['nihao']);
  const gd=distract(['xiexie','zaijian','bukeqi'],2);
  if(S.seen.huanying&&gd.length){
    showLine(a,[U('nihao'),PU('！')],t().hello,{noNext:true});learn(['nihao'],true);
    const ok=pick(['huanying','huanying','nihao']);

  }else{
    await sayLine(g,a,[U('nihao'),PU('！')],t().hello);

  }
  S.visits++;
  const o=buildOrder(makeOrder());
  await teach(g,o.words);
  cur=Object.assign(o,{animal:a,mistakes:0,given:[],ready:true,done:false});
  cur.revealed=o.words.some(w=>!(S.m[w]>0));
  showLine(a,o.units,o.tr,{order:true,showTr:cur.revealed});
  markPulse();
  await new Promise(r=>{cur.resolve=r;});chk(g);
  await sleep(1400);chk(g);
  const drink=W[cur.given[0]].mw==='bei',yum=drink?'haohe':'haochi',total=cur.total;
  cur=null;
  let asked=false;
  if(S.served>=3&&total<=10&&(!S.seen.duoshaoqian||Math.random()<.6)){asked=true;await askPrice(g,a,total);}
  await teach(g,['xiexie',yum]);
  const thanks=[U('xiexie'),PU('！'),U(yum),PU('！')],td=distract(['nihao','zaijian','huanying'],2);
  if(S.seen.bukeqi&&td.length){
    showLine(a,thanks,t().thanks+' '+t().yum,{noNext:true});learn(['xiexie',yum],true);
    await reply(g,'bukeqi',td,t().yw);
  }else{
    await sayLine(g,a,thanks,t().thanks+' '+t().yum);
    await teach(g,['bukeqi']);catMood=performance.now()+1200;
    await sayLine(g,'mao',[U('bukeqi'),PU('！')],t().yw);
  }
  if(!asked||Math.random()<.4){
    await teach(g,['zaijian']);
    const zd=distract(['nihao','xiexie','huanying'],2);
    if(zd.length){showLine(a,[U('zaijian'),PU('！')],t().bye,{noNext:true});learn(['zaijian'],true);await reply(g,'zaijian',zd,t().bye);}
    else await sayLine(g,a,[U('zaijian'),PU('！')],t().bye);
  }
  clearLine();
  cust.state='out';cust.t0=performance.now();plateItems=[];
  await sleep(750);chk(g);
  cust=null;
}

  if(mode==='shop'){
    const list=tab==='food'?FOODS.filter(f=>PRICE[f]):tab==='decor'?DECORS:ACCS;
    h=`<div class="panel frame"><header class="gut"><h2><span class="hz">商店</span><small>shāngdiàn · ${x.shop}</small></h2><span class="grow"></span><div class="coins frame pxc">${COIN}<span>${S.coins}</span></div><button class="pbtn pxc" data-close aria-label="Close">×</button></header>
    <div class="tabs gut" role="tablist">${[['food','茶点',x.tFood],['decor','装饰',x.tDecor],['acc','打扮',x.tAcc]].map(a=>`<button class="tab" role="tab" data-tab="${a[0]}" aria-selected="${tab===a[0]}"><span class="hz">${a[1]}</span><span class="sub">${a[2]}</span></button>`).join('')}</div>
    <div class="body gut"><div class="rows">${list.map(id=>{const w=W[id];return `<div class="row"><button class="say" data-say="${id}">${icon(id)}<span><span class="hz">${w.h}</span><span class="py">${w.p}</span><span class="tr">${w[S.lang]}</span></span></button>${S.own[id]?`<span class="own">✓ ${x.owned}</span>`:`<button class="buy" data-buy="${id}"${S.coins<PRICE[id]?' disabled':''}>${COIN}${PRICE[id]}</button>`}</div>`;}).join('')}</div></div></div>`;
  }else{
    const seen=Object.keys(S.seen).length,total=Object.keys(W).length;
    h=`<div class="panel frame"><header class="gut"><h2><span class="hz">词语</span><small>cíyǔ · ${x.words}</small></h2><span class="grow"></span><button class="pbtn pxc" data-close aria-label="Close">×</button></header>
    <div class="body gut"><div class="cardtop">${icon('mao')}<div><b>喵喵茶馆</b><span>${x.day} ${S.days.length} · <em>${seen}</em> / ${total} ${x.learned}</span></div></div>
    ${GROUPS.map(g=>`<div class="grp">${x[g[1]]}</div><div class="cards">${Object.keys(W).filter(id=>W[id].g===g[0]).map(id=>{const w=W[id];if(!S.seen[id])return `<div class="wcard lock">?</div>`;const ic=icon(id);return `<button class="wcard${ic?'':' big'}" data-say="${id}">${ic}<span class="hz">${w.h}</span><span class="py">${w.p}</span><span class="tr">${w[S.lang]}</span>${stars(id)}</button>`;}).join('')}</div>`).join('')}
    <p class="note">${x.hear}</p>
    <div class="grp">${x.saveTitle}</div>
    <div class="savebox"><button class="pbtn" data-savecopy>${x.saveCopy}</button><textarea id="saveCode" rows="2" placeholder="${x.savePaste}" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><button class="pbtn" data-saveload>${x.saveLoad}</button></div>
    ${FEEDBACK_URL?`<a class="fb pbtn" href="${FEEDBACK_URL}" target="_blank" rel="noopener">${x.feedback}</a>`:''}
    <button class="reset" data-reset>${x.reset}</button><p class="ver">v${VERSION}</p></div></div>`;
  }
  sheet.innerHTML=h;sheet.querySelector('.body').scrollTop=sc;
}
function openSheet(m){mode=m;sheet.hidden=false;sheet.innerHTML='';renderSheet();}
function closeSheet(){sheet.hidden=true;sheet.innerHTML='';mode=null;}
/* Swaps in a whole new state (fresh, or restored from a save code) and returns to the start screen. */
function restart(ns){
  gen++;spk++;S=ns;save();closeSheet();
  const cr=choiceRes;
  const pend=[nextRes,cardRes,cur&&cur.resolve,cr&&(()=>cr.res({miss:1}))];cur=null;cust=null;plateItems=[];lastAnimal=null;
  pend.forEach(f=>{if(f)f();});
  cardOv.hidden=true;clearLine();renderTray();hud();
  $('#startCat').src=iconURL('mao');$('#start').hidden=false;
}
const saveCode=()=>'MM1-'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function readCode(str){
  try{
    const r=JSON.parse(decodeURIComponent(escape(atob(String(str).trim().replace(/^MM1-/,'').replace(/\s+/g,'')))));
    return r&&typeof r==='object'&&r.own&&typeof r.own==='object'?clean(r):null;
  }catch(e){return null;}
}
sheet.addEventListener('click',e=>{
  if(e.target===sheet||e.target.closest('[data-close]'))return closeSheet();
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;sheet.querySelector('.body').scrollTop=0;return renderSheet();}
  const by=e.target.closest('[data-buy]');
  if(by){
    const id=by.dataset.buy;if(S.own[id]||S.coins<PRICE[id])return;
    S.coins-=PRICE[id];S.own[id]=1;learn([id]);
    sayWord(id);[1,3,5].forEach((n,i)=>tone(PENTA[n],i*.09,.2));
    if(curLine&&curLine.who==='mao')setFace('mao');
    renderTray();hud();return renderSheet();
  }
  const sy=e.target.closest('[data-say]');if(sy)return sayWord(sy.dataset.say);
  const rs=e.target.closest('[data-reset]');
  if(rs){
    if(!rs.classList.contains('sure')){rs.classList.add('sure');rs.textContent=t().sure;clearTimeout(sureT);sureT=setTimeout(()=>{if(rs.isConnected){rs.classList.remove('sure');rs.textContent=t().reset;}},4000);return;}
    return restart(fresh());
  }
  const sc=e.target.closest('[data-savecopy]');
  if(sc){
    const code=saveCode(),ta=$('#saveCode');ta.value=code;ta.focus();ta.select();
    const shown=()=>{sc.textContent=t().saveShown;};
    try{navigator.clipboard.writeText(code).then(()=>{sc.textContent=t().saveCopied;},shown);}catch(err){shown();}
    return;
  }
  const sl=e.target.closest('[data-saveload]');
  if(sl){const ns=readCode($('#saveCode').value);if(ns)restart(ns);else sl.textContent=t().saveBad;}
});

/* ---------- Wiring ---------- */
tray.addEventListener('click',e=>{const b=e.target.closest('.slot[data-id]');if(b)tapItem(b.dataset.id,b);});
$('#btnShop').addEventListener('click',()=>openSheet('shop'));
$('#btnBook').addEventListener('click',()=>openSheet('book'));
$('#btnSound').addEventListener('click',()=>{
  if(S.sound&&silent()){toast(t().noVoice,true,5000);}
  S.sound=!S.sound;save();hud();
  if(!S.sound){spk++;if(curSrc){try{curSrc.stop();}catch(e){}}if(hasTTS){try{speechSynthesis.cancel();}catch(e){}}}
  else if(!silent())toast(t().sndOn);
});
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{
  S.lang=b.dataset.lang;
  const d=new Date(),day=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  if(S.days.indexOf(day)<0)S.days.push(day);
  save();
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}
  decodeClips();
  pickVoice();setTimeout(()=>{pickVoice();if(S.sound&&silent())toast(t().noVoice,true,6000);},3200);
  applyLang();hud();renderTray();
  $('#start').hidden=true;fit();
  if(runGen!==gen){runGen=gen;run(gen);}
}));

/* ---------- Boot ---------- */
$('#coinImg').src=COINURL;
$('#startCat').src=iconURL('mao');
(function(){const c=pixText('喵喵茶馆',24,'#3a2318','#d99a5b');$('#title').src=c.toDataURL();$('#title').width=c.width*3;})();
$('#verStart').textContent='v'+VERSION;
if(FEEDBACK_URL){$('#fbStart').href=FEEDBACK_URL;$('#fbStart').hidden=false;}
// Social apps open links in their own browser, where saved progress is easy to lose.
if(/Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Bytedance|MicroMessenger|Snapchat|Line\//i.test(navigator.userAgent))$('#iabTip').hidden=false;
// The standalone site (not the preview page) ships a service worker for offline play.
if(document.querySelector('meta[name="mm-pwa"]')&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
setFace('mao');
renderTray();applyLang();hud();fit();
requestAnimationFrame(draw);
})();
</script>
